[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-standards-service"
version = "1.0.0"
description = "Versioned creative specifications and deterministic asset validation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["weasyprint>=69.0,<70.0"]

[project.scripts]
claude-ads-core = "claude_ads_core.cli:main"

[tool.setuptools.packages.find]
include = ["creative_standards*", "claude_ads_core*"]

[tool.setuptools.package-data]
claude_ads_core = ["schemas/v1/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
